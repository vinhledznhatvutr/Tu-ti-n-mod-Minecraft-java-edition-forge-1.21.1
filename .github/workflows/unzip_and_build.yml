name: Unzip and Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create extraction directory
        run: mkdir -p extracted_src

      - name: Find and unzip all .zip files
        run: |
          find . -path "./extracted_src" -prune -o -name "*.zip" -print0 | while IFS= read -r -d '' zipfile; do
            echo "Extracting $zipfile to extracted_src/"
            unzip -o "$zipfile" -d extracted_src/
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle (system)
        run: sudo apt-get install -y gradle

      - name: Locate project and build
        run: |
          cd extracted_src
          
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not find build.gradle anywhere!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Nếu chưa có gradlew, tạo wrapper bằng gradle hệ thống (vừa cài)
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Built Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyinginstrument-jar
          path: "extracted_src/**/build/libs/*.jar"
