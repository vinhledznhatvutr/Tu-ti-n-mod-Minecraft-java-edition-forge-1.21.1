name: Unzip and Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create extraction directory
        run: mkdir -p extracted_src

      - name: Find and unzip all .zip files
        run: |
          find . -path "./extracted_src" -prune -o -name "*.zip" -print0 | while IFS= read -r -d '' zipfile; do
            echo "Extracting $zipfile to extracted_src/"
            unzip -o "$zipfile" -d extracted_src/
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
          cache-read-only: true

      - name: Patch build.gradle to fix reobfJar issue
        run: |
          cd extracted_src
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not find build.gradle anywhere!"
            exit 1
          fi
          echo "Found build.gradle at: $BUILD_FILE"
          
          # Xóa dòng dependsOn reobfJar
          sed -i '/dependsOn.*reobfJar/d' "$BUILD_FILE"
          
          # Thêm task reobfJar rỗng nếu chưa có
          if ! grep -q "task reobfJar" "$BUILD_FILE"; then
            echo "Adding dummy task reobfJar {} to build.gradle"
            echo -e "\ntask reobfJar {}" >> "$BUILD_FILE"
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Build with Gradle (jar task)
        run: |
          cd extracted_src
          PROJECT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Could not find build.gradle"
            exit 1
          fi
          echo "Build directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew jar --no-daemon --stacktrace

      - name: Upload Built Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyinginstrument-jar
          path: "extracted_src/**/build/libs/*.jar"
