name: Unzip and Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip .zip file
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Locate project directory and build
        run: |
          # Tìm thư mục chứa file gradlew
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: Could not find gradlew file anywhere!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Built Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyinginstrument-jar
          path: "**/build/libs/*.jar"
